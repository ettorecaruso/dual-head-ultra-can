# Named channel variants: the single source of truth for every propagation
# parameter. The runner resolves `--channel <name>` (or `channel.variant` in an
# experiment profile) against this file and deep-merges it over the `channel`
# block of base_config.yaml, so no propagation default lives in the sources.
#
# `nominal` must stay byte-equal to the `channel` block of base_config.yaml:
# tests/test_channel_config.py enforces the equality, which is what keeps the two
# copies from drifting.
nominal:
  model: aerial_multiecho
  direct_fading: rician
  echo_fading: none
  echo_fading_kappa_db: 6.0
  direct_fading_kappa_db: null
  num_echoes_model: fixed
  poisson_echoes_mean: 2.0
  hold_mode: per_symbol
  add_awgn: true
  echo_only_mode: false

b_tdl_d:
  model: tdl_3gpp
  direct_fading: rician
  direct_fading_kappa_db: 10.0
  time_block_slots: 53
  echo_fading: none
  echo_fading_kappa_db: 6.0
  num_echoes_model: fixed
  poisson_echoes_mean: 2.0
  hold_mode: per_hop
  add_awgn: true
  echo_only_mode: false
  clutter_power_fraction: 0.25
  clutter_fading: rayleigh
  clutter_kappa_db: 0.0
  clutter_doppler_max: 0.00008
  max_pdp_truncation_fraction: 0.1
  pdp:
    profile: TDL-D
    kind: exponential
    n_taps: 13
    rms_delay_spread_ns: 300.0
    decay_db_per_ds: 4.343
    delays_ns: []
    powers_db: []

